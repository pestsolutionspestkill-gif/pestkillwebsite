# Render Blueprint: one web service runs the whole website (API + built frontend).
# Render → New → Blueprint → pick this repo. You will be asked for the values marked sync: false.
services:
  - type: web
    name: pestkill
    runtime: node
    plan: free
    buildCommand: cd frontend && npm ci && npm run build && cd ../backend && npm ci
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true          # long random secret, created by Render
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL            # Neon → Connection string (starts with postgresql://, includes sslmode=require)
        sync: false
      - key: CLIENT_ORIGIN           # your site URL, e.g. https://pestkill.onrender.com (comma-separate several)
        sync: false
      - key: OWNER_NAME
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PHONE
        sync: false
      - key: OWNER_PASSWORD          # used only once, to create the first Owner account
        sync: false
