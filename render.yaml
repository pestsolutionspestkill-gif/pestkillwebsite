# Render Blueprint: one web service runs the whole website (API + built frontend).
# Render → New → Blueprint → pick this repo. You will be asked for the values marked sync: false.
# Node version comes from "engines" in the root package.json.
services:
  - type: web
    name: pestkill
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true          # long random secret, created by Render
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL            # Neon → Connection string (starts with postgresql://, includes sslmode=require)
        sync: false
      - key: GMAIL_USER              # Gmail address that sends sign-up codes, e.g. pestsolutionspestkill@gmail.com
        sync: false
      - key: GMAIL_APP_PASSWORD      # 16-character Google App Password (not your normal Gmail password)
        sync: false
      - key: SITE_URL                # Your public address, e.g. https://www.pestkill.in (used in sitemap and canonical links)
        sync: false
      - key: GOOGLE_SITE_VERIFICATION # Optional: the content="..." code from Google Search Console (HTML tag method)
        sync: false
      - key: OWNER_NAME
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PHONE
        sync: false
      - key: OWNER_PASSWORD          # Owner login password (8+ characters); change it here to change the password
        sync: false
